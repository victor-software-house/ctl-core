[package]
name = "ctl-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Terminal widgets built on ctl-text: tables, records, rules, stacks, and indents"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["terminal", "table", "layout", "unicode", "cli"]
categories = ["command-line-interface", "text-processing"]
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cap-lints", "warn"]

[lints]
workspace = true

[dependencies]
ctl-text.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
