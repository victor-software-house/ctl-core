[package]
name = "ctl-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Terminal output for CLIs: colour policy per stream, colour depth, width, and an escape encoder"
license.workspace = true
repository.workspace = true
keywords = ["terminal", "color", "ansi", "tty", "cli"]
categories = ["command-line-interface"]
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cap-lints", "warn"]

[lints]
workspace = true

[features]
default = ["detect"]
# Asks the operating system about a stream: its window size, through
# `terminal_size`, and what it is. It adds `Probe::of`, `Terminal::detect`,
# the `from_process` constructors, and `Console::print`. Without it the
# crate holds the encoder, the colour conversion, and `Terminal::from_probe`.
detect = ["dep:terminal_size"]

[dependencies]
anstyle.workspace = true
ctl-text.workspace = true
terminal_size = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

# A reader that closes stdout early. It has no libtest harness, because the
# harness prints its own banner to stdout, and a reader that quits after the
# first line would break that write before the code under test runs.
[[test]]
name = "closed_pipe"
path = "tests/closed_pipe.rs"
harness = false
required-features = ["detect"]

# A `NO_COLOR` that is not valid UTF-8, set on a child process, because a test
# cannot set it in its own environment without `unsafe`. The target has no
# libtest harness: the child reports through its exit code from a plain `main`.
[[test]]
name = "non_utf8_no_color"
path = "tests/non_utf8_no_color.rs"
harness = false
required-features = ["detect"]
