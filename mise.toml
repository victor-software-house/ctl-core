# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.10.3"

[settings]
# mise loads git:: task includes only in experimental mode.
experimental = true
lockfile = true

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

# The toolchain lives here, not in mise.dev.toml, because CI loads only
# MISE_ENV=ci. The stable pin equals rust-toolchain.toml and rust-version.
[tools]
rust = [
  # Pinned stable: build, lint, test.
  { version = "1.99.0", components = "clippy", mr_boxington = true },
  # Formatting only, for rustfmt's unstable options.
  { version = "nightly-2026-09-29", profile = "minimal", components = "rustfmt" },
]
mr-boxington = "1.20.0"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:obi1kenobi/cargo-semver-checks" = "0.51.0"
jq = "1.8.2"

[task_config]
includes = [
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=v0.4.2",
  # The standard Rust tasks (check:toolchain, format, lint, test, test:doc,
  # deny, deny:advisories, deps, semver, verify). Other repositories include
  # this file by git:: URL at a release tag; this repository reads its own copy.
  "tasks/rust.toml",
]

[tasks."check:features"]
description = "Compile each advertised feature set without extra features"
run = [
  "cargo check --no-default-features",
  "cargo check --no-default-features --features document",
  "cargo check --no-default-features --features render",
  "cargo check --no-default-features --features surface-model",
  "cargo check --no-default-features --features surface-serde",
  "cargo check --no-default-features --features surface-templates",
  "cargo check --no-default-features --features surface",
  "cargo check --no-default-features --features validate",
  "cargo check --no-default-features --features input",
  "cargo check --no-default-features --features fixture",
  "cargo check --no-default-features --features served",
  "cargo check --no-default-features --features usage",
  "cargo check --no-default-features --features json",
  "cargo check --no-default-features --features cli",
  "cargo check --no-default-features --features view",
  "cargo check --no-default-features --features help",
  "cargo check --no-default-features --features app",
  "cargo check --no-default-features --features app,usage",
  "cargo check --no-default-features --features schema",
]

# The shared verify depends on check:repo for a repository's own checks.
# ctl-core has none beyond the shared tasks.
[tasks."check:repo"]
description = "This repository's own checks: none beyond the shared tasks"
run = "true"

# CI's Semver step. 0.6.15 removes the public `baseline` module and feature,
# which no consumer enables, and the operator ruled a patch release. While the
# newest ctl-core on crates.io is 0.6.14, semver-checks compares against it as
# a major release, so that removal passes on this PR, the Version PR, and main.
# Once 0.6.15 is published the condition is false and the full check runs
# again; delete this task and call `semver` from CI then.
[tasks."semver:ci"]
description = "semver, allowing the 0.6.15 baseline removal while 0.6.14 is the newest release"
shell = "bash -o pipefail -c"
run = '''
newest=$(curl -fsS -A ctl-core-ci https://crates.io/api/v1/crates/ctl-core | jq -r .crate.max_stable_version)
if [ "$newest" = "0.6.14" ]; then
  exec cargo semver-checks --baseline-version 0.6.14 --release-type major
fi
exec cargo semver-checks
'''
