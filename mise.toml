# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.11.6"

[settings]
# Every tool, whether a config file, a task or the command line asks for it,
# comes from the locks; one with no entry fails instead of being looked up.
locked = true
# mise loads git:: task includes, and runs [deps] providers, only in
# experimental mode.
experimental = true
lockfile = true
# The platforms CI and contributors use, from the platforms answer. Without
# it, mise install fills every tool up to the platforms any tool already
# records, and rewrites the locks.
lockfile_platforms = ["linux-x64", "macos-arm64"]

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

# The toolchain lives here instead of in mise.dev.toml, because CI loads only
# MISE_ENV=ci. The stable pin equals rust-toolchain.toml and rust-version.
[tools]
rust = [
  # Pinned stable: build, lint, test.
  { version = "1.100.0", profile = "minimal", components = "clippy", mr_boxington = true },
  # rustfmt's unstable options, and rustdoc as docs.rs builds it.
  { version = "nightly-2026-11-01", profile = "minimal", components = "rustfmt" },
]
mr-boxington = "1.30.0"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:obi1kenobi/cargo-semver-checks" = "0.51.0"
jq = "1.8.2"
# The repository checks (mise-tasks/check/repo.sh).
taplo = "0.10.0"
rumdl = "0.3.2"
typos = "1.51.1"
actionlint = "1.7.12"
# OpenSpec's standalone release binary; it needs no node.
"github:Fission-AI/OpenSpec" = "1.16.0"

# The shared Rust tasks read their toolchains from here and name none.
[env]
# format runs rustfmt on the nightly, for its unstable options.
RUSTFMT_TOOLCHAIN = "+nightly-2026-11-01"
# doc builds on the nightly, as docs.rs does.
RUST_NIGHTLY = "nightly-2026-11-01"
# cargo skips a crates.io release younger than this, unless Cargo.lock holds it.
CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE = "3 days"
# The crates.io logins whose crates `mise run update:own` takes past the cooldown.
CARGO_TRUSTED_OWNERS = "any-victor"

# The one gate, composed from the pieces this repository keeps. deny:advisories
# and semver need the network, so they run as their own CI steps.
[tasks.verify]
description = "Every offline check this repository runs"
depends = [
  "check:toolchain",
  "format",
  "lint",
  "check:features",
  "check:tree",
  "check:size",
  "test",
  "test:usage",
  "test:cli",
  "test:input-toml",
  "test:doc",
  "doc",
  "doc:default-features",
  "doc:no-default-features",
  "check:docs",
  "deny",
  "deps",
  "check:versions",
  "check:repo",
]

# The shared doc task builds every feature, so an intra-doc link to an item
# behind a feature resolves there even when a crate's own feature set lacks
# it. These two build each crate with its default features and with none.
# --workspace unifies features across the members, which adds none here:
# ctl-core's defaults ask ctl-term only for detect, its own default, and
# ctl-core without features depends on no member. They use doc's target
# directory, so the three builds take turns on one lock. No task reads the
# HTML they write, so the docs left in target/rustdoc may come from any of
# them; `mise run doc` writes the docs.rs build.
[tasks."doc:default-features"]
description = "rustdoc for every crate with its default features, warnings denied"
run = 'cargo +${RUST_NIGHTLY} doc --no-deps --workspace --locked'
env = { RUSTDOCFLAGS = "--cfg docsrs -D warnings", CARGO_TARGET_DIR = "target/rustdoc" }

[tasks."doc:no-default-features"]
description = "rustdoc for every crate without its default features, warnings denied"
run = 'cargo +${RUST_NIGHTLY} doc --no-deps --workspace --no-default-features --locked'
env = { RUSTDOCFLAGS = "--cfg docsrs -D warnings", CARGO_TARGET_DIR = "target/rustdoc" }

# Prose habits from the prose-style package; .vale.ini picks the files. `vale
# sync` fetches the package named there, so the first run needs the network.
[tasks."lint:prose"]
description = "Prose habits in the docs, the crate docs, and the changesets"
tools = { "aqua:vale-cli/vale" = "3.26.0" }
usage = 'arg "[path]" var=#true default="." help="Files or directories to check"'
run = ["vale sync", "vale ${usage_path}"]

# mise-tasks/ holds this repository's task fragments and file tasks. An
# includes list replaces the default task dirs, so mise-tasks comes first; add
# pinned git:: catalogs after it.
[task_config]
includes = [
  # Pinned git:: catalogs follow mise-tasks.
  "mise-tasks",
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=v0.6.0",
  # `mise run ver`, which the release workflow, check:versions, and semver
  # run. Bump the ref together with the verctl pin in mise.release.toml and
  # the workflow's pin.
  "git::https://github.com/victor-software-house/verctl.git//tasks/ver?ref=v0.8.6-rc.5",
  # The shared Rust tasks, at actions main, 2026-11-14.
  "git::https://github.com/victor-software-house/actions.git//tasks/rust.toml?ref=0c64886d642612fa5f1dcc6920fcb12c51c4b1eb",
  # template:check, template:off, and template:on, at actions main, 2026-11-14.
  "git::https://github.com/victor-software-house/actions.git//tasks/template.toml?ref=0c64886d642612fa5f1dcc6920fcb12c51c4b1eb",
]
