[settings]
lockfile = true

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

[task_config]
includes = [
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=v0.4.2",
  # The standard Rust tasks. Other repositories include this file by git::
  # URL at a release tag; this repository reads its own copy.
  "tasks/rust.toml",
]
