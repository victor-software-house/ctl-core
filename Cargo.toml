[workspace]
members = ["ctl-core", "ctl-layout", "ctl-term", "ctl-text"]
resolver = "3"

[workspace.package]
version = "0.6.28"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/victor-software-house/ctl-core"

[workspace.dependencies]
anyhow = "1.0.104"
anstyle = "1.0.14"
clap = { version = "4.6.6", default-features = false, features = [
  "std",
  "derive",
  "env",
  "string",
] }
garde = { version = "0.23.0", default-features = false }
# The dynamic engine is behind `unstable-dynamic`, which carries no semver
# promise, so the pin is exact and every bump is a reviewed change.
clap_complete = { version = "=4.6.11", default-features = false, features = [
  "unstable-dynamic",
] }
document-features = "0.2.12"
indoc = "2.0.7"
minijinja = { version = "2.24.0", features = ["serde"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "2.0.0", default-features = false, features = [
  "deserialize",
  "comments",
] }
tempfile = "3.27.0"
# The window size of the stream being written (ctl-term). It has no features.
terminal_size = "0.4.4"
toml = { version = "1.1.8", default-features = false, features = [
  "std",
  "parse",
  "serde",
] }
yamled = { version = "0.0.8", default-features = false }
ctl-layout = { path = "ctl-layout", version = "=0.6.28" }
# Without `detect`: ctl-core's `render` tier needs only the encoder, and its
# `view` and `help` features turn `detect` on again.
ctl-term = { path = "ctl-term", version = "=0.6.28", default-features = false }
ctl-text = { path = "ctl-text", version = "=0.6.28" }
unicode-bidi = { version = "0.3.18", default-features = false }
unicode-segmentation = { version = "1.13.3", default-features = false }
# `cjk` stays off: East Asian ambiguous characters count 1 cell, and the
# second width table stays out of the binary.
unicode-width = { version = "0.2.2", default-features = false }
# Property tests for the text engine (ctl-text). `std` alone: the default
# features add process forking and timeouts the tests do not use.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Snapshot tests for rendered output (tests/snapshots). Pinned exactly: a new
# insta can change how a snapshot file is read or written, so a bump is a
# reviewed change. No colors: CI logs and review diffs stay plain.
insta = { version = "=1.49.0", default-features = false }
# Runs each shell on a pseudo-terminal for the hook tests
# (ctl-core/tests/support/terminal.rs): an interactive shell draws no prompt,
# and fish runs no typed line, when it reads a pipe. Pinned exactly like insta.
pty-process = "=0.5.4"
# A KDL v2 parser for the Usage spec tests (ctl-core/tests/usage_spec.rs),
# which read every spec back. Test-only, so it never reaches a build. Without
# defaults: the tests need neither spans nor serde. Pinned exactly like insta;
# deny.toml lets only ctl-core depend on it.
kdl = { version = "=6.7.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
missing_crate_level_docs = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it, not a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# format! or push_str, not + on a String.
string_add = "deny"
# From and TryFrom, not as, which can silently truncate or wrap. A site that
# truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]>, not Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls the first the
# idiomatic path and mod.rs the older style, whose many same-named files blur
# together in an editor (ch07-05, "Alternate File Paths").
mod_module_files = "deny"
# A library logs through tracing or log; printing is the binary's choice.
print_stdout = "deny"
print_stderr = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

# check:size builds ctl-core's `size` example with the release profile at each
# tier on linux-x64 and fails when its `.text` exceeds the tier's budget by
# more than tolerance-percent. A change that grows a tier on purpose raises the
# budget in the same pull request, and one that shrinks a tier lowers it. The
# budgets are the `.text` that CI measured on linux-x64 with rustc 1.99.1
# (58cf8f9c3 2026-10-13) at 72eaae8, where ctl-term's error converts into
# `io::Error` without boxing.
[workspace.metadata.size]
tolerance-percent = 2

[workspace.metadata.size.tiers]
# No render code; unchanged since the size example was added.
cli = { features = "cli", text = 343888 }
# 906 above the first engine budget, 443676: clusters stay whole across
# spans, line breaks stay word boundaries, and equal styles merge.
help = { features = "help", text = 444582 }
# 364 below the first engine budget, 409362: the ctl-text growth, offset by
# a smaller ctl-layout Table and a smaller inlined View setup.
view = { features = "cli,view", text = 408998 }
# 188 below the first engine budget, 469842: help's growth, less the
# copies View no longer keeps beside its one RenderOptions.
app = { features = "app", text = 469654 }

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

# The smallest binary that keeps its speed (TPL-031). Against opt-level 3 with
# thin LTO, a ctl CLI came out 35% smaller and 4% slower. opt-level "z" takes
# another 25% off but runs a ledger parse 51% slower: a repository whose run
# time does not matter sets it here. Cargo ignores the profiles of a
# dependency, so a library's consumers see none of this.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
