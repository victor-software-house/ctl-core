[workspace]
members = ["ctl-core", "ctl-layout", "ctl-term", "ctl-text"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/victor-software-house/ctl-core"

[workspace.dependencies]
anyhow = "1.0.104"
anstyle = "1.0.14"
clap = { version = "4.6.6", default-features = false, features = [
  "std",
  "derive",
  "env",
  "string",
] }
# Exact, because FieldPath reads the parts of garde's path through the
# doc-hidden `Path::__iter`, which a release may change without notice.
garde = { version = "=0.23.0", default-features = false }
# The dynamic engine is behind `unstable-dynamic`, which carries no semver
# promise, so the pin is exact and every bump is a reviewed change.
clap_complete = { version = "=4.6.11", default-features = false, features = [
  "unstable-dynamic",
] }
document-features = "0.2.12"
indoc = "2.0.7"
minijinja = { version = "2.24.0", features = ["serde"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# serde-saphyr 2.1.1 with two patches: deserialize_str tells a borrowed-string
# mismatch by its variant, not its Display text, and an alias error takes the
# plain message. So the snippet renderer stays out of every binary that loads
# input (size-cuts task 5.3). Drop the fork when upstream stops calling
# Display in both places.
serde-saphyr = { package = "vsh-serde-saphyr", version = "=0.0.3", default-features = false, features = [
  "deserialize",
  "comments",
] }
tempfile = "3.27.0"
# The window size of the stream being written (ctl-term). It has no features.
terminal_size = "0.4.4"
toml = { version = "1.1.8", default-features = false, features = [
  "std",
  "parse",
  "serde",
] }
yamled = { version = "=0.0.12", default-features = false }
ctl-layout = { path = "ctl-layout", version = "=0.7.0" }
# Without `detect`: ctl-core's `render` tier needs only the encoder, and its
# `view` and `help` features turn `detect` on again.
ctl-term = { path = "ctl-term", version = "=0.7.0", default-features = false }
ctl-text = { path = "ctl-text", version = "=0.7.0" }
unicode-bidi = { version = "0.3.18", default-features = false }
unicode-segmentation = { version = "1.13.3", default-features = false }
# `cjk` stays off: East Asian ambiguous characters count 1 cell, and the
# second width table stays out of the binary.
unicode-width = { version = "0.2.2", default-features = false }
# Property tests for the text engine (ctl-text). `std` alone: the default
# features add process forking and timeouts the tests do not use.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Snapshot tests for rendered output (tests/snapshots). Pinned exactly: a new
# insta can change how a snapshot file is read or written, so a bump is a
# reviewed change. No colors: CI logs and review diffs stay plain.
insta = { version = "=1.49.0", default-features = false }
# Runs each shell on a pseudo-terminal for the hook tests
# (ctl-core/tests/support/terminal.rs): an interactive shell draws no prompt,
# and fish runs no typed line, when it reads a pipe. Pinned exactly like insta.
pty-process = "=0.5.4"
# A KDL v2 parser for the Usage spec tests (ctl-core/tests/usage_spec.rs),
# which read every spec back. Test-only, so it never reaches a build. Without
# defaults: the tests need neither spans nor serde. Pinned exactly like insta;
# deny.toml lets only ctl-core depend on it.
kdl = { version = "=6.7.1", default-features = false }

[workspace.lints.rust]
# deny instead of forbid, because forbid refuses the item-level
# #[expect(unsafe_code, reason = "...")] that a justified exception carries.
unsafe_code = "deny"
# Each unsafe operation inside an unsafe fn sits in its own unsafe block.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
missing_crate_level_docs = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it instead of a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# `format!` or `push_str` instead of `+` on a String.
string_add = "deny"
# From and TryFrom instead of as, which can silently truncate or wrap. A site
# that truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]> instead of Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# Every unsafe block carries a // SAFETY: comment and holds one unsafe
# operation, so each comment justifies exactly one call.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls foo.rs the
# idiomatic path and mod.rs the older style (ch07-05, "Alternate File Paths").
# Many files named mod.rs blur together in an editor.
mod_module_files = "deny"
# A library logs through tracing or log; printing is the binary's choice.
print_stdout = "deny"
print_stderr = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

# check:size builds ctl-core's `size` example with the release profile at each
# tier on linux-x64 and fails when its `.text` exceeds the tier's budget by
# more than tolerance-percent. A change that grows a tier on purpose raises the
# budget in the same pull request, and one that shrinks a tier lowers it. The
# budgets are the `.text` that CI measured on linux-x64 with rustc 1.99.1
# (58cf8f9c3 2026-10-13) at 72eaae8, where ctl-term's error converts into
# `io::Error` without boxing.
[workspace.metadata.size]
tolerance-percent = 2

[workspace.metadata.size.tiers]
# No render code; unchanged since the size example was added.
cli = { features = "cli", text = 343888 }
# 2,304 above the last budget, 444582: ctl-core declares -h/--help and the
# help subcommand itself since Clap's help feature stays off (size-cuts
# decision 6).
help = { features = "help", text = 446886 }
# 364 below the first engine budget, 409362: the ctl-text growth, offset by
# a smaller ctl-layout Table and a smaller inlined View setup.
view = { features = "cli,view", text = 408998 }
# 2,320 above the last budget, 469654: the same declared help flag and
# subcommand as help (size-cuts decision 6).
app = { features = "app", text = 471974 }
# app plus the answer to mise's --usage-spec: the Usage KDL writer.
usage = { features = "app,usage", text = 525798 }
# app plus input: serde-saphyr, yamled, and garde. 1,731 above the last budget,
# 1041402: FieldPath, Input::place and problem_at, and the kept yamled document
# (field-path-place). The one before it, 624 above 1040778, was Limits building
# the serde-saphyr Budget from ctl-core's own defaults (split-input-formats,
# decision 3).
input = { features = "app,input", text = 1043133 }
# app plus input-toml: the toml crate and ctl-core's depth and node walk, with
# no YAML crate and no garde. 448,927 below input. 1,568 above the last budget,
# 592638: FieldPath, Input::place and problem_at (field-path-place).
input-toml = { features = "app,input-toml", text = 594206 }

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

# The smallest binary that keeps its speed. Against opt-level 3 with thin LTO,
# a ctl CLI came out 35% smaller and 4% slower.
#
# opt-level "z" takes another 25% off but runs a ledger parse 51% slower. A
# repository whose run time does not matter sets it here. Cargo ignores the
# profiles of a dependency, so a library's consumers see none of this.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
