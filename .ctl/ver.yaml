# A bump leaves Cargo.lock stale, and ci.yml runs `cargo package --locked`.
prepare:
  after: [cargo, update, --workspace]
  stage: [Cargo.lock]

packages:
  - name: ctl-core
    path: Cargo.toml

# The workspace crates release together at one version, and ctl-core requires
# ctl-layout, ctl-term, and ctl-text at exactly that version. `prepare`
# rewrites each requirement onto the Version PR commit, so the tagged tree
# packages with the version it publishes.
patterns:
  ctl-layout-requirement:
    match: 'ctl-layout = { path = "ctl-layout", version = "={version}" }'
    occurrences: once
    whole_line: true
  ctl-term-requirement:
    match: 'ctl-term = { path = "ctl-term", version = "={version}", default-features = false }'
    occurrences: once
    whole_line: true
  ctl-text-requirement:
    match: 'ctl-text = { path = "ctl-text", version = "={version}" }'
    occurrences: once
    whole_line: true

pins:
  - file: Cargo.toml
    package: ctl-core
    patterns: [ctl-layout-requirement, ctl-term-requirement, ctl-text-requirement]

# Maintainers and Apps a changelog never credits (verctl 0.4.0).
changelog:
  internal_authors:
    - any-victor
    - "github-actions[bot]"
    - "vsh-changeset-version[bot]"
