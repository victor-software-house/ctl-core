# Prose habits in the Markdown docs, the crate docs, and the changesets, from
# the prose-style package. `vale sync` fetches the package into StylesPath.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/victor-software-house/prose-style/releases/download/v0.0.1/ProseStyle.zip

# Rust doc comments are Markdown: paragraphs split, fenced code is skipped.
[formats]
rs = md

[*.rs]
BasedOnStyles = ProseStyle, Direct
# The package sets these two for Markdown only; doc comments take the same.
Direct.Length = warning
Direct.Ease = NO

# Generated, research kept as written, plans, test inputs, or tool files.
[{CHANGELOG.md,CLAUDE.md,docs/research/**,openspec/**,.github/**,**/tests/**,**/examples/**,**/target/**,.vale/**,.claude/**}]
BasedOnStyles =
