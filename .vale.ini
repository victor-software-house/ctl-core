# Prose habits in the Markdown docs, the Rust comments, and the changesets,
# from the prose-style package. `vale sync` fetches the package into
# StylesPath.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/victor-software-house/prose-style/releases/download/v0.0.1/ProseStyle.zip

# Vale lints the comments in a Rust file, `//` comments as well as `///` and
# `//!` docs, and never its code or string literals. This mapping reads those
# comments as Markdown, which rustdoc renders them as: paragraphs split at
# blank lines, and fenced doctests and inline code spans are skipped. Without
# it, Vale reads each comment as plain text and flags identifiers inside
# backticks and doctest lines as prose.
[formats]
rs = md

[*.rs]
BasedOnStyles = ProseStyle, Direct
# The package sets these two for Markdown only, so Rust files repeat them.
# Direct.Length stays a warning, as in Markdown. Direct.Ease is off because it
# fired on most one-line item docs, such as "Returns the width.", where a
# short line is what the house rules ask for.
Direct.Length = warning
Direct.Ease = NO

# Generated, research kept as written, plans, test inputs, or tool files.
[{CHANGELOG.md,CLAUDE.md,docs/research/**,openspec/**,.github/**,**/tests/**,**/examples/**,**/target/**,.vale/**,.claude/**}]
BasedOnStyles =
