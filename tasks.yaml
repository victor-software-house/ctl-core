# yaml-language-server: $schema=https://github.com/victor-software-house/qctl/releases/download/v0.6.0/tasks.schema.json
schema_version: 5
prefix: CTC

style:
  timezone: "-03:00"
  section_order: [queue, horizon, archive]
active: CTC-006

queue:
  - id: CTC-006
    title: Test fixture tree and per-suite temp dirs
    scope: ctl-core
    outcome: >-
      Integration tests write files through a small fixture API, not
      repeated fs::write + indoc. Each suite or scenario gets its own
      temp root.
    blocked_by: []
    acceptance:
      - A cfg(test) or ctl-core test feature exposes the helper (not a new public runtime crate unless we need one).
      - root.file(path, body) (or equivalent) is the write path. Nested paths create parents.
      - Suite::new(name) / suite.scenario(name) each own a TempDir that drops at the end of the test.
      - verctl (then qctl/forkctl) can drop the copy-pasted fs::write fixtures after pinning that ctl-core version.
    notes:
      - Triggered by verctl tests (prepare_stage, changelog, publish). Do not invent a second tempfile wrapper in each *ctl.

  - id: CTC-008
    title: Own the declared-input layer every ctl CLI parses config with
    scope: ctl-core
    outcome: >-
      One implementation of "read it, parse the shape, validate it once,
      complain in the repo's own words" — instead of one per CLI, drifting.
    blocked_by: []
    acceptance:
      - 'The shared validators live here: a path that must stay inside the repository, a single file name, a list that needs at least one entry, a value that cannot be empty.'
      - Each one is a garde `custom` rule generic over the context, so it works in a schema validated against nothing and in one validated against the whole document.
      - A complaint says what a person changes ("must declare at least one label"), never a stock validator's wording ("length is lower than 1").
      - 'One entry point loads a file: read, serde for shape, garde once at the boundary, nothing downstream re-checking.'
      - verctl drops its own src/schema.rs after pinning that ctl-core version, and no copy is left behind.
      - The declare-your-own-target template renderer is available to any ctl CLI, not only verctl.
      - qctl drops its own YAML parsing for config after pinning that ctl-core version.
      - The loader parses YAML with serde-saphyr, with strict booleans, and duplicate keys and merge keys refused; qctl, verctl, and forkctl read every YAML input through it.
      - A schema error names its file and line, placed through the yamled location index, and every error in a file is reported, not only the first.
      - The loader splits Markdown frontmatter, so verctl reads changeset fragments through it and drops gray_matter.
    notes:
      - "2026-08-18: verctl built this while shipping served files (VER-018, and VER-022 is the matching row there). It is already shared between two unrelated schemas in that repo — a TOML config file and a Jinja template's own exports — which is the evidence it is not verctl-shaped. Do this row before VER-022 so that one is a move rather than a fork. Related: qctl's schemars work and VER-021 want JSON Schema generated from these same types, so keep the types derive-friendly."
      - '2026-09-24: verctl parses YAML with yaml_serde 0.10.7 and qctl with serde_yml 0.0.12, so two ctl CLIs already disagree on the parser. Pick one crate here, by our own evaluation, and move both.'
      - "2026-09-24: verctl's config is YAML (.ctl/ver.yaml) since verctl 0.1.0. The TOML file in the 2026-08-18 note is gone."
      - '2026-09-28: YAML stack decided by evaluation on the build host. serde-saphyr 1.3.0 against yaml_serde 0.10.7: both keep dates as strings and reject 2026-02-31 through a JSON Schema date format; yaml_serde silently keeps the last duplicate key when read into serde_json::Value, turns .inf into null, and gives no line for a missing field; serde-saphyr reports a line for every error and rejects both once strict_booleans, merge_keys: Error, and with_snippet: false are set. Edits move to yamled (github.com/victor-software-house/yamled), a pure-Rust format-preserving editor on granit-parser spans, because yamlpatch requires yaml_serde. That drops yaml_serde, yamlpath, yamlpatch, tree-sitter, serde_yml, gray_matter, and yaml-rust2 from the family.'
      - "2026-09-29: first slice in ctl-core. The validate feature carries verctl's four garde rules; the input feature (Input::load, check, parse, frontmatter) reads YAML through serde-saphyr with strict booleans and duplicate and merge keys refused, and places every garde problem on its file and line through yamled 0.0.1 with default features off. Plan: openspec/changes/archive/2026-10-11-declared-input/proposal.md. Left on this row: verctl, qctl, and forkctl move onto input; verctl drops src/schema.rs and gray_matter; the template renderer moves here."

  - id: CTC-020
    title: Take template v0.0.5 and lock only the platforms in use
    scope: .copier-answers.yml at templates v0.0.5, mise.toml [settings], and every mise lock
    outcome: mise install on linux-x64 or macos-arm64 leaves every lock unchanged, because mise.toml declares lockfile_platforms and every lock records exactly those two platforms.
    blocked_by: []
    acceptance:
      - copier update to v0.0.5 leaves no conflict marker, and mise.toml sets lockfile_platforms = ["linux-x64", "macos-arm64"].
      - Every lock is regenerated whole with mise lock --platform linux-x64,macos-arm64, and its linux-x64 and macos-arm64 entries match main.
      - On a fresh linux-x64 machine, mise install leaves git status clean, and mise run verify passes.

  - id: CTC-042
    title: Measure a non-generic copy of the help subcommand tree
    scope: "ctl-core: parser"
    outcome: The help subcommand ctl-core declares costs no more .text than it needs.
    blocked_by: []
    acceptance:
      - The help-subcommand copy's size is measured, and the cheaper form is kept.
    notes:
      - '2026-11-09, in rawr the copy cost 1,644 bytes of .text: Command::subcommands over copy_for_help, 1,229, and Vec<Command>::from_iter, 415.'
      - A loop that pushes each copy, with no generic iterator, may cost less. Nobody has measured it.
      - Design decision 16 of openspec/changes/archive/2026-11-10-terminal-render-engine/design.md holds the attribution.

  - id: CTC-043
    title: >-
      Take every command's input as JSON or YAML, from a file or stdin, as output
      takes --format
    scope: src/input.rs, the App chassis
    outcome: >-
      Any ctl CLI accepts a command's arguments as one structured document, with the same choice of formats its output offers.
    blocked_by: []
    acceptance:
      - A command built on ctl-core reads its arguments from --input FILE or --input -, in JSON or YAML chosen by --input-format or the file extension, validated by the same rules as its flags.
      - Flags and an input document combine by one stated precedence, and an unknown field fails naming it, as the output side reports errors.
      - qctl, verctl and forkctl each accept it for at least one command, with a golden test.
    notes:
      - "2026-11-07, operator, while adding rows to a private repository's queue with long qctl flag lists: qctl should take nicer input formats, such as JSON or from files; that is partly or even mostly a ctl-core thing; we need to support JSON inputs and from files, the same way as multiple output formats are."
      - CTC-008 owns the declared-input layer for config files; this row extends input to command arguments.
      - 2026-11-09, it ships as a patch after 0.7.0 (operator).

  - id: CTC-047
    title: Run the prose check in CI
    scope: .github/workflows, mise.toml
    outcome: >-
      CI fails a pull request whose Markdown, Rust comments or changesets break the
      prose rules.
    blocked_by: []
    acceptance:
      - CI runs mise run lint:prose on every pull request, and it passes on main.
      - "verify stays offline: lint:prose runs as its own CI step, as deny:advisories does, or through the shared template's prose piece."
    notes:
      - Moved from the release prerequisites of openspec/changes/archive/2026-11-10-terminal-render-engine/tasks.md when the change was archived. ctl-core 0.7.0 shipped without it.
      - 2026-11-10, no workflow on main 56ec3d0 runs lint:prose.

  - id: CTC-048
    title: rawr takes ctl-core 0.7.0 with clap's default features off
    scope: "rawr: Cargo.toml"
    outcome: rawr links ctl-core 0.7.0 and only the clap features its own code needs.
    blocked_by: []
    acceptance:
      - A rawr pull request pins ctl-core =0.7.0 or later and reviews its snapshot diff, and its CI passes.
      - In that pull request, rawr's own clap sets default-features = false and keeps a default feature only where rawr needs it, with a comment saying why.
      - --help, a subcommand's --help, an unknown-argument error and a missing-argument error match byte for byte before and after, except where ctl-core 0.7.0 changed them, each named. The pull request body records .text before and after.
    notes:
      - 'Moved from task 8.1 of openspec/changes/archive/2026-11-10-terminal-render-engine/tasks.md when the change was archived. verctl #267, qctl #179 and forkctl #165 did the same for the other three consumers.'
      - 2026-11-10, rawr's main pins ctl-core =0.6.28 with clap's default features on.
      - Design decision 16 measured 80,672 bytes of .text saved in rawr with ctl-core 4bc7862.

  - id: CTC-049
    title: Place a problem under a flattened map on its own line
    scope: "ctl-core: input"
    outcome: >-
      A garde problem inside a map that serde flattens into its parent names the path
      the file holds and lands on that line.
    blocked_by: []
    acceptance:
      - A garde problem whose path passes through a `#[serde(flatten)]` map field lands on the line of its own key in the file, such as the `files:` line under `assets.linux-x64`, not on the parent mapping.
      - The printed field is the path the file holds, `assets.linux-x64.files`, with no segment for the Rust field that the map flattens.
      - A field path with no flattened segment prints and lands exactly as before, and the problem-report snapshot shows no other change.
    notes:
      - 'Triggered by verctl #313 (VER-107). There a target under `assets` is a `#[serde(flatten)]` map entry, so garde reports `assets.targets.linux-x64.files` and `places` lands on the `assets:` line, because the file has no `targets` key.'
      - garde_derive 0.23 parses `#[garde(rename)]` into an alias it never emits, so a struct cannot drop the segment itself, and a hand-written Validate would replace the declared rules.
    plan: openspec/changes/flattened-field-place/proposal.md

  - id: CTC-051
    title: Complete bash, zsh, fish, elvish, PowerShell, and Nushell, with run-time candidates
    scope: "ctl-core: completion, usage"
    outcome: >-
      Every ctl CLI takes its whole completion from ctl-core, and forkctl drops its
      own copy.
    blocked_by: []
    acceptance:
      - The usage KDL writer emits complete run= entries for arguments whose candidates are computed at run time.
      - forkctl main has no clap_complete import outside ctl-core.
      - ctl-core completion prints a registration for bash, zsh, fish, elvish, and PowerShell through clap_complete env, and for Nushell a registration ctl-core writes itself that takes run-time candidates from its Usage spec, the script usage-lib writes for forkctl today.
    notes:
      - 2026-11-10, ctl-core main 1d6746b, completion.rs line 84 lists Bash, Zsh, and Fish only, and the KDL writer emits no run= entries.
      - 2026-11-10, forkctl main writes its own elvish and PowerShell registrations in src/main.rs line 266 and lists six shells in src/instructions.md line 131.
      - Found 2026-11-09 during the forkctl adoption of ctl-core 0.7.0.
      - 2026-11-11, clap_complete 4.6 Shells::builtins() lists Bash, Elvish, Fish, Powershell, and Zsh only, and clap_complete_nushell writes static scripts, so Nushell run-time candidates come from usage::complete with shell nu (forkctl src/main.rs line 279).
      - 2026-11-11, deny.toml line 31 bans usage-lib and check:tree rejects it (archived size-cuts change), so ctl-core writes the Nushell registration itself, as it writes the Usage KDL; lifting that ban is a separate decision with its clap-defaults size cost.

  - id: CTC-052
    title: Let the usage spec leave hidden commands out
    scope: "ctl-core: usage"
    outcome: >-
      A ctl CLI can publish a usage spec that lists only the commands an operator may
      run.
    blocked_by: []
    acceptance:
      - ctl-core has an option that leaves every hidden command out of the usage KDL, with a test.
      - verctl drops its removed verbs from its usage spec once it adopts the release that ships the option.
    notes:
      - 2026-11-10, ctl-core main 1d6746b writes hidden commands with hide=#true (usage/nodes.rs line 282) and has no option to drop them.
      - verctl lists its removed verbs prepare and pin in its usage spec, marked hidden, and its command-names spec says so.

  - id: CTC-055
    title: List the top-level entries of a YAML or TOML text
    scope: input
    outcome: >-
      Input::top_level gives each top-level entry's key, the byte range and style of
      its value and its string, for a caller that reads a mapping it did not write.
    blocked_by: []
    acceptance:
      - A test lists the entries of a YAML text with every way a value is written, an anchor, an alias and a tag, and one of a TOML text, with the exact value ranges.
      - A YAML text with a repeated key, a merge key, .inf, -.inf and .NaN lists every entry, where parse refuses each, and a number, boolean or null key is listed by its text, with tests.
      - A key that is a sequence, mapping or alias is left out, a root that is no mapping gives none, and a text past a limit gives the error parse gives.
    plan: openspec/changes/top-level-entries/proposal.md
    notes:
      - "2026-11-11, hakkiri HKR-049 needs it for front matter: yamled 0.0.13 lists a mapping's entries, serde-saphyr types each value, and the TOML tree holds the spans."
      - '2026-11-12, found by the hakkiri HKR-049 front matter probe against Vale 66bbb85: top_level gave the parse error for a repeated key, a merge key or a .inf or .NaN value, and left out a number or null key, where Vale lints the values of all of them. It reads under its own serde-saphyr options now, and lists a scalar key by its text.'

  - id: CTC-056
    title: Suggest the missing value in a parse error
    scope: "app: parse errors"
    outcome: >-
      When a required argument is missing, the error names the full command line to
      run with a value the CLI suggests, for any verb of any ctl CLI, in pretty and JSON
      output.
    blocked_by: []
    acceptance:
      - An argument can register a suggester through the public App or parser API, and a verb flattened from ctl-core registers its own with no consumer code.
      - A suggester that suggests nothing leaves the error as Clap writes it.
      - "The exit code stays Clap's usage code, 2: a suggestion never runs anything."
      - A missing-argument error for an argument with a suggester prints Clap's message, then each suggested command line. Its JSON error holds the suggestions as data, with no ANSI.
    links:
      - https://github.com/clap-rs/clap/blob/master/clap_builder/src/error/kind.rs
    notes:
      - '2026-11-13, operator decision: a missing shell for completion stays an error, and the better error is a general ctl-core facility, not wording special to that verb.'
      - 2026-11-13, App::clap_error prints error.to_string() unchanged today, so no hint can reach the user.

  - id: CTC-057
    title: Detect the running and login shell for shell verbs
    scope: shell, completion
    outcome: >-
      ctl-core reads the shell a command runs in and the user's login shell, and the completion verb's missing-shell error suggests the script for each, login shell first, as Homebrew orders profile-file advice.
    blocked_by:
      - CTC-056
    acceptance:
      - Shell::from_path maps a path or name to a Shell by its basename, with a version suffix such as zsh-5.9 removed, and returns None for any other shell.
      - A resolved_ reader returns the parent process's shell, and another returns the shell $SHELL names; each returns None when it cannot tell.
      - Tests cover a nested shell whose parent differs from $SHELL, an unset $SHELL, an unknown shell name, and a versioned name.
      - rawr, verctl and qctl get the new error by bumping ctl-core, with no change to their own code.
      - With no shell, completion fails with exit code 2 and suggests the login shell's command line first, from $SHELL. When the running shell differs, its command line follows. Each comes with the startup-file line for its shell, as Homebrew orders profile-file advice.
    links:
      - https://github.com/Homebrew/brew/blob/main/Library/Homebrew/utils/shell.rb
    notes:
      - '2026-11-13, operator decision: the shell stays a required argument, as in mise, fnox, uv, rustup and chezmoi; the error detects both the parent shell and the system shell.'
      - 2026-11-13, Homebrew's Utils::Shell reads $SHELL as the preferred shell, and runs `ps -p PPID -o ucomm=` for the parent shell; both go through from_path. Output a shell evaluates, such as `brew --env` and `command-not-found-init`, tries the parent first. Advice for a profile file, in `caveats.rb`, tries $SHELL first. `brew --env` detects the shell only with `--shell=auto`.
      - 2026-11-13, gh completion with no -s prints the bash script. That silent default gives a zsh user the bash script.

  - id: CTC-036
    title: Live regions, progress, spinners and prompts
    scope: ctl-term/, ctl-layout/
    outcome: >-
      A CLI streams progress to stderr while the report stays on stdout: a live region on a terminal, a GitHub Actions group per step, or plain start and end lines, with diagnostics that render as a warning line, a GitHub annotation, JSON and a step summary.
    notes:
      - Phase 3 of openspec/changes/archive/2026-11-10-terminal-render-engine/design.md, decision 14.
      - CTC-034 shipped on 2026-11-09, so the engine this row waited for exists.
      - 'Mode by detection, no flag needed: live when stderr is a terminal; github when GITHUB_ACTIONS=true; plain otherwise. A long-only --progress <live|plain|github> overrides it, and --quiet keeps only failures (operator, 2026-11-13).'
      - Diagnostics carry a level, a code, and an optional file and line. GitHub allows 10 annotations per level per step, so the tenth one counts the rest. The step summary lists them all.
      - verctl pilots it for release, release --dry-run, check and docs.
      - 'Prior art: turbo groups logs on GitHub Actions only; nextest and cargo turn the live bar off in CI; mise summary prints one line per passing task.'
    blocked_by: []
    acceptance:
      - ctl-core exposes a progress stream with live, plain and github modes, picked by detection and overridable by --progress.
      - The report stays on stdout in pretty and JSON output while progress goes to stderr.
      - Diagnostics render as a warning line, GitHub annotations capped at 10 per level per step, a JSON diagnostics array, and a step summary.
      - verctl uses it for release and release --dry-run.
horizon:
  - id: CTC-027
    title: Design the decision and research document checker
    scope: design
    outcome: >-
      One design names how decision and research records in openspec/ are checked,
      and where the checker lives.
    kind: research
    open: Binary name and repository not chosen.
    notes:
      - The checker reads the openspec/ layout that qctl already reads for its agreement checks. That reader moves into ctl-core when the checker becomes its second user.
      - 'Records follow one layout: decisions in openspec/decisions/<date>-<slug>.md with MADR 4 frontmatter, and research next to its spec.'

  - id: CTC-028
    title: Own OpenSpec's checks in Rust
    scope: design
    outcome: >-
      One decision says whether ctl owns the OpenSpec spec and delta checks in Rust
      instead of running the upstream OpenSpec CLI.
    kind: research
    open: >-
      Reopen only when one of the triggers in the notes holds; a 2026-10-24 review
      found no reason to rewrite now.
    notes:
      - 'Trigger: upstream breaks the spec or delta format, or archive merges a delta wrongly with no fix.'
      - 'Trigger: upstream stalls for 60 days or leaves the MIT licence.'
      - 'Trigger: two more strict-rule bumps arrive with no opt-out; see https://github.com/Fission-AI/OpenSpec/issues/2069.'
      - 'Trigger: the document checker (CTC-027) ends up parsing specs anyway.'
      - 'Trigger: the standalone Bun-built binary misbehaves and upstream will not fix it.'

  - id: CTC-035
    title: Panels, trees, columns and hyperlinks in the engine
    scope: ctl-layout/, ctl-term/
    outcome: >-
      A CLI draws a panel, a tree, side-by-side columns and OSC 8 hyperlinks through
      ctl-core, with a hyperlink allow-list and FORCE_HYPERLINK.
    kind: deferred
    open: Starts after CTC-034 ships the engine.
    notes:
      - Phase 2 of openspec/changes/archive/2026-11-10-terminal-render-engine/design.md, decision 14.

  - id: CTC-037
    title: Render bundled Markdown in the terminal
    scope: ctl-markdown/
    outcome: >-
      verctl, qctl and forkctl show their instructions as rendered Markdown instead
      of raw text, through a ctl-markdown crate on pulldown-cmark.
    kind: deferred
    open: Starts after CTC-034 ships the engine.
    notes:
      - Phase 4 of openspec/changes/archive/2026-11-10-terminal-render-engine/design.md, decision 14. Its own crate because pulldown-cmark is a dependency no other leaf needs.

  - id: CTC-038
    title: Move declared input to a ctl-input leaf
    scope: ctl-input/
    outcome: >-
      serde-saphyr, yamled, garde and toml sit in a ctl-input crate that ctl-core
      re-exports behind its input features.
    kind: deferred
    open: >-
      Needs a consumer that reads declared input without the CLI chassis, or a
      measured build gain.
    notes:
      - From decision 2 of openspec/changes/archive/2026-11-10-terminal-render-engine/design.md.

  - id: CTC-039
    title: Move served files and the operator surface to a ctl-surface leaf
    scope: ctl-surface/
    outcome: >-
      MiniJinja sits in a ctl-surface crate that ctl-core re-exports behind its surface and served features.
    kind: deferred
    open: >-
      Needs a consumer that renders operator documents without the CLI chassis, or a
      measured build gain.
    notes:
      - From decision 2 of openspec/changes/archive/2026-11-10-terminal-render-engine/design.md.

  - id: CTC-040
    title: Move test fixtures to a ctl-fixture leaf
    scope: ctl-fixture/
    outcome: Consumers take ctl-fixture as a dev-dependency without the rest of ctl-core.
    kind: deferred
    open: Needs the workspace from CTC-034.
    notes:
      - From decision 2 of openspec/changes/archive/2026-11-10-terminal-render-engine/design.md. tempfile is its only dependency.

  - id: CTC-050
    title: Keep operator docs in headed sections of bounded size
    scope: docs
    outcome: >-
      Every ctl operator document stays in headed sections a reader can scan, and a
      check fails one that grows past a set size.
    kind: research
    open: "Choose the mechanism: a prose-style Vale rule on section length, the shared operator templates, or instructions held as structured data that ctl-core renders."
    notes:
      - verctl instructions held a 473-line Version PR section with no subheading, and its skill held 170 lines under one heading, until a hand split into sections of 22 lines or fewer.
      - The operator asked for oversized sections and headless prose blocks to be forbidden in every operator document, and for the mechanism to be analysed first (operator, 2026-11-10).

  - id: CTC-058
    title: Set up a ctl CLI in a repository with one command
    scope: "ctl-core and every ctl CLI: verctl, qctl, forkctl"
    outcome: >-
      A spike shows how one command sets up a ctl CLI in a repository and opens the
      pull request that carries the setup.
    kind: research
    open: >-
      Nobody has surveyed what each CLI asks a repository to set up by hand, or how
      an installer could do it.
    notes:
      - '2026-11-13, each repository wires a CLI by hand: the git:: task include, the pin, the release workflow caller, the App secrets, the checks in verify, and the hooks.'
      - '2026-11-13, the ledger check runs in verify only where a repository lists it: templates does, and verctl, qctl, forkctl and ctl-core do not.'
      - 'Candidates to compare: a setup verb in each CLI on a ctl-core primitive, a Copier piece, and a GitHub App that installs a workflow and opens a pull request.'
      - The operator asked for this as a horizon spike, not for now (operator, 2026-11-13).
      - verctl pilots the setup command before qctl and forkctl take it (operator, 2026-11-13).

  - id: CTC-059
    title: Run the ctl checks wherever a GitHub App is installed
    scope: "ctl-core and every ctl CLI: verctl, qctl, forkctl"
    outcome: >-
      A spike shows whether a GitHub App can run each ctl CLI check on every pull
      request of the repositories it is installed on, with no workflow in those
      repositories.
    kind: research
    open: >-
      Nobody has compared an App with a reusable workflow for running the checks, or
      priced where an App would run them.
    notes:
      - The operator asked for this beside CTC-058, so that the checks run everywhere a tool is used or the App is installed (operator, 2026-11-13).
      - 'Prior art in this organization: the Kodus GitHub App reviews every pull request of the repositories it covers.'
      - verctl pilots it, starting with the registry checks of the release design in verctl docs/research/2026-11-13-atomic-releases.md.

archive:
  - id: CTC-054
    title: Place a key as well as a value
    scope: "ctl-core: input"
    outcome: >-
      A CLI places a fault on the key it is about, and on the item of a list it is
      about, through one public call.
    plan: openspec/changes/archive/2026-11-11-key-place/proposal.md
    notes:
      - '2026-11-11, asked by hakkiri: place gives where a value starts, so a fault about a glob key whose value is a block mapping lands one line below it. yamled holds the key span as Node::key and the toml tree holds the key span of each entry.'
    completed: 2026-11-11T22:04:53
    evidence:
      - '2026-11-12 (UTC): PR 280 merged as 60e91fa. Input::place_key places the key of the last step of a FieldPath for YAML and TOML, and the root and an index step give their value, with tests.'
    disposition: completed

  - id: CTC-053
    title: Place every problem through one public field path
    scope: "ctl-core: input"
    outcome: >-
      A garde problem, and a problem a CLI raises itself, land on the line of the field they name through one public path type, including under a mapping key that holds dots, stars or slashes.
    notes:
      - 2026-11-11, ctl-core main 1cbad5c, input.rs line 411 field_steps splits garde's printed field on '.' and '[', so files.docs/**/*.md.vocab[0] reads as the keys files, docs/**/*, md and vocab, and the lookup stops at files. Its comment at line 405 says a key holding '.' or '[' cannot be told apart from nesting.
