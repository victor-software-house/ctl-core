queue:
  - id: CTC-006
    title: Test fixture tree and per-suite temp dirs
    scope: ctl-core
    outcome: >-
      Integration tests write files through a small fixture API, not
      repeated fs::write + indoc. Each suite or scenario gets its own
      temp root.
    blocked_by: []
    acceptance:
      - A cfg(test) or ctl-core test feature exposes the helper (not a new public runtime crate unless we need one).
      - root.file(path, body) (or equivalent) is the write path. Nested paths create parents.
      - Suite::new(name) / suite.scenario(name) each own a TempDir that drops at the end of the test.
      - verctl (then qctl/forkctl) can drop the copy-pasted fs::write fixtures after pinning that ctl-core version.
    notes:
      - Triggered by verctl tests (prepare_stage, changelog, publish). Do not invent a second tempfile wrapper in each *ctl.

  - id: CTC-008
    title: Own the declared-input layer every ctl CLI parses config with
    scope: ctl-core
    outcome: >-
      One implementation of "read it, parse the shape, validate it once,
      complain in the repo's own words" — instead of one per CLI, drifting.
    blocked_by: []
    acceptance:
      - 'The shared validators live here: a path that must stay inside the repository, a single file name, a list that needs at least one entry, a value that cannot be empty.'
      - Each one is a garde `custom` rule generic over the context, so it works in a schema validated against nothing and in one validated against the whole document.
      - A complaint says what a person changes ("must declare at least one label"), never a stock validator's wording ("length is lower than 1").
      - 'One entry point loads a file: read, serde for shape, garde once at the boundary, nothing downstream re-checking.'
      - verctl drops its own src/schema.rs after pinning that ctl-core version, and no copy is left behind.
      - The declare-your-own-target template renderer is available to any ctl CLI, not only verctl.
      - qctl drops its own YAML parsing for config after pinning that ctl-core version.
      - The loader parses YAML with serde-saphyr, with strict booleans, and duplicate keys and merge keys refused; qctl, verctl, and forkctl read every YAML input through it.
      - A schema error names its file and line, placed through the yamled location index, and every error in a file is reported, not only the first.
      - The loader splits Markdown frontmatter, so verctl reads changeset fragments through it and drops gray_matter.
    notes:
      - "2026-08-18: verctl built this while shipping served files (VER-018, and VER-022 is the matching row there). It is already shared between two unrelated schemas in that repo — a TOML config file and a Jinja template's own exports — which is the evidence it is not verctl-shaped. Do this row before VER-022 so that one is a move rather than a fork. Related: qctl's schemars work and VER-021 want JSON Schema generated from these same types, so keep the types derive-friendly."
      - '2026-09-24: verctl parses YAML with yaml_serde 0.10.7 and qctl with serde_yml 0.0.12, so two ctl CLIs already disagree on the parser. Pick one crate here, by our own evaluation, and move both.'
      - "2026-09-24: verctl's config is YAML (.ctl/ver.yaml) since verctl 0.1.0. The TOML file in the 2026-08-18 note is gone."
      - '2026-09-28: YAML stack decided by evaluation on the build host. serde-saphyr 1.3.0 against yaml_serde 0.10.7: both keep dates as strings and reject 2026-02-31 through a JSON Schema date format; yaml_serde silently keeps the last duplicate key when read into serde_json::Value, turns .inf into null, and gives no line for a missing field; serde-saphyr reports a line for every error and rejects both once strict_booleans, merge_keys: Error, and with_snippet: false are set. Edits move to yamled (github.com/victor-software-house/yamled), a pure-Rust format-preserving editor on granit-parser spans, because yamlpatch requires yaml_serde. That drops yaml_serde, yamlpath, yamlpatch, tree-sitter, serde_yml, gray_matter, and yaml-rust2 from the family.'
      - "2026-09-29: first slice in ctl-core. The validate feature carries verctl's four garde rules; the input feature (Input::load, check, parse, frontmatter) reads YAML through serde-saphyr with strict booleans and duplicate and merge keys refused, and places every garde problem on its file and line through yamled 0.0.1 with default features off. Plan: openspec/changes/archive/2026-10-11-declared-input/proposal.md. Left on this row: verctl, qctl, and forkctl move onto input; verctl drops src/schema.rs and gray_matter; the template renderer moves here."

  - id: CTC-020
    title: Take template v0.0.5 and lock only the platforms in use
    scope: .copier-answers.yml at templates v0.0.5, mise.toml [settings], and every mise lock
    outcome: mise install on linux-x64 or macos-arm64 leaves every lock unchanged, because mise.toml declares lockfile_platforms and every lock records exactly those two platforms.
    blocked_by: []
    acceptance:
      - copier update to v0.0.5 leaves no conflict marker, and mise.toml sets lockfile_platforms = ["linux-x64", "macos-arm64"].
      - Every lock is regenerated whole with mise lock --platform linux-x64,macos-arm64, and its linux-x64 and macos-arm64 entries match main.
      - On a fresh linux-x64 machine, mise install leaves git status clean, and mise run verify passes.

  - id: CTC-042
    title: Measure a non-generic copy of the help subcommand tree
    scope: "ctl-core: parser"
    outcome: The help subcommand ctl-core declares costs no more .text than it needs.
    blocked_by: []
    acceptance:
      - The help-subcommand copy's size is measured, and the cheaper form is kept.
    notes:
      - '2026-11-09, in rawr the copy cost 1,644 bytes of .text: Command::subcommands over copy_for_help, 1,229, and Vec<Command>::from_iter, 415.'
      - A loop that pushes each copy, with no generic iterator, may cost less. Nobody has measured it.
      - Design decision 16 of terminal-render-engine holds the attribution.

  - id: CTC-043
    title: >-
      Take every command's input as JSON or YAML, from a file or stdin, as output
      takes --format
    scope: src/input.rs, the App chassis
    outcome: >-
      Any ctl CLI accepts a command's arguments as one structured document, with the same choice of formats its output offers.
    blocked_by: []
    acceptance:
      - A command built on ctl-core reads its arguments from --input FILE or --input -, in JSON or YAML chosen by --input-format or the file extension, validated by the same rules as its flags.
      - Flags and an input document combine by one stated precedence, and an unknown field fails naming it, as the output side reports errors.
      - qctl, verctl and forkctl each accept it for at least one command, with a golden test.
    notes:
      - "2026-11-07, operator, while adding rows to a private repository's queue with long qctl flag lists: qctl should take nicer input formats, such as JSON or from files; that is partly or even mostly a ctl-core thing; we need to support JSON inputs and from files, the same way as multiple output formats are."
      - CTC-008 owns the declared-input layer for config files; this row extends input to command arguments.
      - 2026-11-09, it ships as a patch after 0.7.0 (operator).
horizon:
  - id: CTC-027
    title: Design the decision and research document checker
    scope: design
    outcome: >-
      One design names how decision and research records in openspec/ are checked,
      and where the checker lives.
    kind: research
    open: Binary name and repository not chosen.
    notes:
      - The checker reads the openspec/ layout that qctl already reads for its agreement checks. That reader moves into ctl-core when the checker becomes its second user.
      - 'Records follow one layout: decisions in openspec/decisions/<date>-<slug>.md with MADR 4 frontmatter, and research next to its spec.'

  - id: CTC-028
    title: Own OpenSpec's checks in Rust
    scope: design
    outcome: >-
      One decision says whether ctl owns the OpenSpec spec and delta checks in Rust
      instead of running the upstream OpenSpec CLI.
    kind: research
    open: >-
      Reopen only when one of the triggers in the notes holds; a 2026-10-24 review
      found no reason to rewrite now.
    notes:
      - 'Trigger: upstream breaks the spec or delta format, or archive merges a delta wrongly with no fix.'
      - 'Trigger: upstream stalls for 60 days or leaves the MIT licence.'
      - 'Trigger: two more strict-rule bumps arrive with no opt-out; see https://github.com/Fission-AI/OpenSpec/issues/2069.'
      - 'Trigger: the document checker (CTC-027) ends up parsing specs anyway.'
      - 'Trigger: the standalone Bun-built binary misbehaves and upstream will not fix it.'

