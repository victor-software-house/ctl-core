# Changes here will be overwritten by Copier; edit with `copier update --data`.
_commit: v0.0.101
_src_path: https://github.com/victor-software-house/templates.git
build_os: linux
ci_runner: github-hosted
clippy_disallowed_methods: []
clippy_disallowed_types: []
default_branch: main
deny_bans:
-   crate: kdl
    reason: a KDL v2 parser for the Usage spec tests only; ctl-core writes the spec
        itself
    wrappers:
    - ctl-core
-   crate: usage-lib
    reason: ctl-core writes the Usage KDL itself, and usage-lib turns clap's default
        features back on
-   crate: winnow:<1.0
    reason: winnow 0.7 reaches the graph only through the test-only kdl
    wrappers:
    - kdl
deny_ignore: []
deny_licenses:
-   license: BSD-3-Clause
    reason: encoding_rs, which serde-saphyr's deserialize feature pulls in for the
        input feature
deny_skip:
-   crate: syn@2
    reason: garde_derive 0.23.0, the latest release, requires syn 2
feature_sets: []
generated_paths: []
github_owner: victor-software-house
layout: workspace
linux_image: ubuntu-26.04
max_width: 100
merge_queue: true
merge_queue_cancel_lower: true
mise_version: 2026.11.6
nightly_fmt: true
pieces:
- hooks
- lint_markdown
- lint_toml
- lint_typos
- openspec
- ci
- drift_check
- rust_tasks
- rustfmt
- clippy
- cargo_lints
- deny
pieces_extra:
- lint_workflows
- machete
- doc_tests
- rustdoc
platforms:
- linux-x64
- macos-arm64
project: rust-crate
published: true
repository_visibility: public
rust_nightly: nightly-2026-11-01
rust_version: 1.99.1
test_profiles:
- test
tokio: false
verify_timeout: 8
workflow_policy:
- drafts
- concurrency
- labels
- permissions
- pins
- mise_env
workflow_policy_namespaces: []
