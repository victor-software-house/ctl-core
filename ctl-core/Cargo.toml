[package]
name = "ctl-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A framework for clap programs: typed results, help, and terminal or JSON output"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["clap", "cli", "help", "color"]
categories = ["command-line-interface", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cap-lints", "warn"]

[package.metadata.cargo-machete]
ignored = ["usage-lib"]

[lints]
workspace = true

[features]
default = ["app"]

## Complete typed CLI lifecycle over the shared help and view layers.
app = ["cli", "view", "help", "dep:anyhow"]

## Clap derive helpers (`OutputArgs`, `DryRunArgs`) and parser defaults.
## Turns on only the Clap features ctl-core calls: `std`, `derive`, `env`,
## and `string`. Clap's own `error-context`, `suggestions`, `help`, and
## `color` features stay the CLI's choice.
cli = ["dep:clap"]

## Semantic presentation documents without a terminal engine.
document = []

## Serde models and the JSON view.
json = ["dep:serde", "dep:serde_json"]

## Rendering semantic documents to a `String` through `ctl-text` and
## `ctl-layout`, with a replaceable `Theme`, written by the `ctl-term`
## encoder. No terminal is asked: the width is explicit or the fallback, and
## nothing is detected.
render = ["document", "unsafe-chars", "dep:ctl-layout", "dep:ctl-term"]

## Which characters are unsafe to print as they are
## (`unsafe_chars::is_unsafe`), re-exported from `ctl-text`.
unsafe-chars = ["dep:ctl-text"]

## JSON Schema for the envelope and enums (`schemars`).
schema = ["json", "dep:schemars"]

## Styled `-h/--help` through the shared document renderer. Adds Clap's
## `usage` feature for the usage line, and `ctl-term`'s `detect` feature,
## which decides colour and width for the stream help goes to.
help = ["cli", "render", "clap/usage", "ctl-term/detect"]

## Pretty, colourless, and JSON output from serializable results. Adds
## `ctl-term`'s `detect` feature, which decides colour and width for the
## stream each result goes to.
view = ["render", "json", "ctl-term/detect"]

## A CLI's commands and flags as data (`surface::Surface`), without
## serialization or a template engine.
surface-model = ["cli", "usage"]

## `Surface` with serialization, without a template engine.
surface-serde = ["surface-model", "dep:serde"]

## Shared MiniJinja fragments for generated documentation files.
surface-templates = ["surface-serde", "dep:minijinja"]

## The same as `surface-templates`.
surface = ["surface-templates"]

## Files a CLI generates into a repository from templates, each template
## declaring its own target path and mode (`served::render`, `Served::write`).
served = [
  "surface-templates",
  "validate",
  "garde/derive",
  "minijinja/deserialization",
]

## Garde rules every declared schema shares (`validate`).
validate = ["dep:garde"]

## Declared input: read, parse with serde-saphyr, validate once with garde,
## and place every problem on its file and line through yamled.
input = ["validate", "dep:serde", "dep:serde-saphyr", "dep:yamled"]

## Declared input from TOML: `Input::open` reads `.toml` files, and the `toml`
## crate's span-carrying tree places each problem on its line and column.
## Enables `input`, whose `Limits` it shares.
input-toml = ["input", "dep:toml"]

## Temporary file trees for integration tests: `Suite`, its scenarios,
## and one call per file.
fixture = ["dep:tempfile"]

## The shells a CLI writes scripts for (`Shell`): bash, zsh, and fish.
shell = ["cli"]

## The `completion <SHELL>` verb and the `COMPLETE` request it registers
## (`CompletionCommand`, `App::completion`), through `clap_complete`'s
## dynamic engine. Enables `app`, which `App::completion` lives on.
completion = ["shell", "view", "app", "dep:clap_complete"]

## The `init <SHELL>` verb: a script that runs one command of the CLI once,
## before the shell's first prompt (`InitCommand`, `Hook`).
shell-init = ["shell", "view"]

## Mise Usage spec from clap (`--usage-spec` and the `#USAGE mount` line).
usage = ["cli", "dep:usage-lib"]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
garde = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
document-features.workspace = true
indoc.workspace = true
minijinja = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
yamled = { workspace = true, optional = true }
usage-lib = { workspace = true, optional = true }
ctl-layout = { workspace = true, optional = true }
ctl-term = { workspace = true, optional = true }
ctl-text = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
garde = { workspace = true, features = ["derive"] }
indoc.workspace = true
kdl.workspace = true
pty-process.workspace = true

[[example]]
name = "gallery"
required-features = ["view"]

# The toy check:size builds at each tier; see [workspace.metadata.size].
[[example]]
name = "size"
required-features = ["cli"]

# A reader that closes stdout early. It has no libtest harness, because the
# harness prints its own banner to stdout, and a reader that quits after the
# first line would break that write before the code under test runs.
[[test]]
name = "closed_pipe"
path = "tests/closed_pipe.rs"
harness = false
required-features = ["app"]
