# Spelling, checked by `mise run lint:typos`.
[files]
# Folded narrow tables split words mid-word on purpose, and the parity
# baselines store each ESC byte as the text `\u{1b}`, which typos reads as
# part of the next word.
extend-exclude = [
  "*.lock",
  "ctl-layout/tests/snapshots/*.snap",
  "ctl-core/tests/parity/baseline/*.txt",
  "ctl-core/tests/parity/engine/*.txt",
]

[default]
# Commit hashes cited in prose, such as `caf2581`, split into short fake words.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
# The Rust terminal UI crate, cited in the rendering research.
ratatui = "ratatui"
