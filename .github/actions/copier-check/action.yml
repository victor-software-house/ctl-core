name: Copier template check
description: >-
  Fails when the newest tag of the shared Copier template would change the
  repository: check.sh runs copier update, at the copier version the template
  pins in its mise.toml at that tag, and fails on any change besides
  .copier-answers.yml. A newer tag that renders the same files passes with a
  notice. Reads the private template repository with a token from the
  vsh-templates-reader GitHub App. The calling repository defines the mise
  env `template`, which installs uv and python.

inputs:
  client-id:
    description: Client ID of the vsh-templates-reader GitHub App
    required: true
  private-key:
    description: Private key of the vsh-templates-reader GitHub App
    required: true
  working-directory:
    description: >-
      Directory that holds the rendered template and its mise config, relative
      to the repository root, for a repository that renders it below the root
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Mint a token that reads the template
      id: app
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        repositories: templates
        permission-contents: read
    - name: Install copier's interpreter
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      env:
        MISE_ENV: template
      with:
        # Must reach every calling repository's min_version: mise refuses to
        # load a mise.toml whose floor is newer than itself.
        version: 2026.10.10
        cache: true
        working_directory: ${{ inputs.working-directory }}
        # check.sh needs only uv and python, not the toolchain.
        install_args: uv python
    - name: Template version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MISE_ENV: template
        # Only this step clones the template, so it alone carries the token.
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app.outputs.token }}@github.com/victor-software-house/templates.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/victor-software-house/templates
      run: "$GITHUB_ACTION_PATH/check.sh"
