name: Copier template check
description: >-
  Fails when the shared Copier template has a newer tag than the repository's
  .copier-answers.yml. Reads the private template repository with a token
  from the vsh-templates-reader GitHub App. The calling repository defines the
  mise env `template` and its `check:template` task.

inputs:
  client-id:
    description: Client ID of the vsh-templates-reader GitHub App
    required: true
  private-key:
    description: Private key of the vsh-templates-reader GitHub App
    required: true

runs:
  using: composite
  steps:
    - name: Mint a token that reads the template
      id: app
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        repositories: templates
        permission-contents: read
    - name: Install locked toolchain
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      env:
        MISE_ENV: template
      with:
        version: 2026.10.3
        cache: true
    - name: Template version
      shell: bash
      env:
        MISE_ENV: template
        # Only this step clones the template, so it alone carries the token.
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app.outputs.token }}@github.com/victor-software-house/templates.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/victor-software-house/templates
      run: mise run check:template
