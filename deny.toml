[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
# RUSTSEC ids and yanked crates that cannot be upgraded yet. Not a lint-level downgrade.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # encoding_rs, which serde-saphyr's deserialize feature pulls in for the input feature
    "BSD-3-Clause",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies carry no version; wildcards stay denied for the rest.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "TLS is rustls" },
    { crate = "native-tls", reason = "TLS is rustls" },
    { crate = "kdl", wrappers = ["ctl-core"], reason = "a KDL v2 parser for the Usage spec tests only; ctl-core writes the spec itself" },
    { crate = "usage-lib", reason = "ctl-core writes the Usage KDL itself, and usage-lib turns clap's default features back on" },
    { crate = "winnow:<1.0", wrappers = ["kdl"], reason = "winnow 0.7 reaches the graph only through the test-only kdl" },
]
skip = [
    { crate = "syn@2", reason = "garde_derive 0.23.0, the latest release, requires syn 2" },
]

# Declarations repeated outside [workspace.dependencies], and unused entries.
[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
