# TOML formatting, checked by `mise run format:toml`.
# The Copier template owns the layout of the files it renders.
exclude = [
  "target/**",
  # The shared task catalog consumers include by URL; its layout is theirs.
  "tasks/rust.toml",
  ".miserc.toml",
  "committed.toml",
  "mise.dev.toml",
  "mise.ci.toml",
  "mise.template.toml",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "clippy.toml",
  "deny.toml",
]
